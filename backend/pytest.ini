[pytest]
# Permite `import core`, `import contracts` y `from tests.fakes import ...`
# desde cualquier carpeta de pruebas (tests/, services/*/tests/, bff/tests/),
# se ejecute pytest desde backend/ o desde la raíz del repo.
pythonpath = .
# Evita choques entre módulos de prueba con el mismo nombre en distintos
# servicios (p. ej. dos `tests/test_service.py`).
addopts = --import-mode=importlib
